function run(){const v=$('#ti').value.trim();if(!v)return;const[c,a]=v.split(/\s+/),i=g.inv[a-1],o=x=>term.push(x);o('$ '+v);
const need=()=>{if(!i){o('Нет такого устройства. Смотрите ls');return 0}return 1};
if(c=='help')o('ls — склад\ndiag N — бесплатная диагностика\nflash N — перепрошить\nprice N — оценка\nbal / stats\nupgrade — прокачать ноутбук\nneofetch, clear');
else if(c=='ls')o(g.inv.map((x,k)=>(k+1)+'. '+x.n+(x.seen?(x.d.length?' ['+dn(x)+']':' [ок]'):' [?]')).join('\n')||'Склад пуст');
else if(c=='diag'&&need()){i.seen=1;o(i.n+': дефекты — '+dn(i))}
else if(c=='price'&&need())o(i.n+': '+(i.seen?'≈ '+fmt(val(i)):'сначала diag'));
else if(c=='flash'&&need()){if(!i.seen)o('Сначала diag');else if(!i.d.includes('sw'))o('Прошивка в порядке');else{o('Прошиваю '+i.n+'...');if(Math.random()<LP[g.lap-1]){i.d=i.d.filter(k=>k!='sw');o('Готово. Блокировка снята.')}else if(Math.random()<.25){i.c*=.7;o('Кирпич! Устройство потеряло 30% состояния.')}else o('Ошибка. Попробуйте ещё раз.')}}
else if(c=='bal')o(fmt(g.money));else if(c=='stats')o('Сделок: '+g.deals+'\nПрибыль: '+fmt(g.profit)+'\nРепутация: '+g.rep);
else if(c=='upgrade'){const p=[0,25000,70000][g.lap];if(g.lap>=3)o('Максимальный уровень');else if(g.money<p)o('Нужно '+fmt(p));else{g.money-=p;g.lap++;o('Ноутбук улучшен: '+LN[g.lap-1])}}
else if(c=='neofetch')o('Перекуп OS 2.0\nCPU: '+['Celeron','Core i5','Ryzen 9'][g.lap-1]+'\nRAM: '+[4,16,64][g.lap-1]+' GB\nUptime: день '+g.day);
else if(c=='clear')term=[];else if(c=='sudo')o('Вы не root. Инцидент зафиксирован 😅');else if(c=='rm')o('Не сегодня.');else o('Неизвестная команда: '+c);
save();render();$('#ti').focus()}

M(`<h2>Осмотр: ${i.n}</h2><div class="im big">${art(i,bk)}</div><button class="btn g" onclick="insp('${id}',${!bk})">🔄 Повернуть</button><div class="mu">Проверок осталось: ${lim()-n}. Выбирайте, что проверить. Часть дефектов можно не заметить.</div><div class="chips" style="flex-wrap:wrap">${PT.map(([k,t,e])=>`<button class="${i.ck[k]?'on':''}" onclick="ck('${id}','${k}',${!!bk})">${e} ${t}</button>`).join('')}</div>${PT.filter(p=>i.ck[p[0]]).map(p=>`<div class="card ${i.ck[p[0]].b?'bad':'ok'}">${p[1]}: ${i.ck[p[0]].t}</div>`).join('')}<button class="btn" onclick="det('${id}')">К объявлению</button>`)}

else if(p=='bat')t='Ёмкость '+(d?60+(Math.random()*18|0):88+(Math.random()*12|0))+'%';
else if(p=='sw')t=d?'Блокировка или зацикленная загрузка':'Включается и работает штатно';
else{b=d&&Math.random()<.7;t=b?'Греется, зарядка с перебоями':'Заряд и нагрев в норме'}
i.ck[p]={t,b};if(b&&DF[p])i.fd=[...(i.fd||[]),p];save();insp(id,bk)}

function rnum(){if(!pay(300))return;const r=Math.random();let d;if(r<.04)d='7'.repeat(7);else if(r<.12){const a=P('0123456789'),b=P('0123456789');d=(a+b).repeat(4).slice(0,7)}else d=Array.from({length:7},()=>P('0123456789')).join('');
const m=Math.max(...[...'0123456789'].map(c=>d.split(c).length-1)),v=m>=7?15000:m>=4?4000:/(.)(.)\1\2/.test(d)?2500:400;g.nums.push({n:'+7 9'+d.slice(0,2)+' '+d.slice(2,5)+'-'+d.slice(5,7)+'-'+(d+d).slice(0,2),v});save();render()}
function snum(k){g.money+=g.nums[k].v;g.nums.splice(k,1);save();render()}
function work(p){if(g.shd==g.day)return toast('Сегодня вы уже работали');g.money+=p;g.shd=g.day;save();render();toast('Смена закрыта: +'+fmt(p))}
function jbk(id){const i=g.inv.find(x=>x.id==id);if(Math.random()<[.55,.8,.95][g.lap-1]){i.d=i.d.filter(k=>k!='sw');toast('Готово: блокировка снята')}else if(Math.random()<.25){i.c*=.7;toast('Кирпич! Состояние −30%')}else toast('Ошибка, попробуйте ещё раз');save();render()}
function bbm(id){const i=g.bm.find(x=>x.id==id);if(g.inv.length>=g.cap)return toast('Склад полон');if(!pay(i.ask))return;g.bm=g.bm.filter(x=>x!=i);if(Math.random()<.25)toast('Кинули: товара нет');else{i.cost=i.ask;g.inv.push(i);toast('Куплено без гарантий')}save();render()}
function bld(){const c=['c1','c2','c3'].map(k=>$('#'+k).value.split('|'));const cost=c.reduce((s,x)=>s+ +x[1],2000);if(g.inv.length>=g.cap)return toast('Склад полон');if(!pay(cost))return;
g.inv.push({id:'p'+Date.now(),ct:5,n:'Сборка: '+c.map(x=>x[0]).join(' + '),base:Math.round(cost*1.4),c:1,d:[],seen:1,cost,s:'Вы',hon:1,ago:0});save();render();toast('ПК собран')}
function gov(a){if(a=='ip'){if(g.ip||!pay(5000))return;g.ip=1;g.rep+=5}else{const t=Math.round(Math.max(0,g.profit-(g.taxed||0))*.06);if(!t)return toast('Налога нет');if(!pay(t))return;g.taxed=g.profit;g.rep++}save();render()}
const opts=a=>a.map(x=>`<option value="${x[0]}|${x[1]}">${x[0]} · ${fmt(x[1])}</option>`).join('');
const V={
bank:()=>H(fmt(g.money),'Баланс'+(g.debt?' · долг '+fmt(g.debt)+' (+2% в день)':''))+[20000,50000,100000].map(n=>B('Кредит '+fmt(n),`loan(${n})`)).join('')+(g.debt?B('Погасить долг','payd()','g'):''),
del:()=>H('Оптом дешевле','Доставка до склада за 1 день')+B('Партия телефонов ×3 · 90 000 ₽','ord(0)')+B('Партия техники ×3 · 160 000 ₽','ord(1)')+(g.del.length?`<div class="mu">В пути партий: ${g.del.length}</div>`:''),
cas:()=>H('Казино','Выплата ×96÷шанс')+'<input id="bt" type="number" placeholder="Ставка, ₽"><input id="ch" type="number" value="50" placeholder="Шанс, %">'+B('Крутить','spin()'),
auc:()=>H('Аукцион','Лоты сегодня')+g.au.map(i=>`<div class="card row"><span><b>${i.n}</b><br><small class="mu">${cl(i)} · ориентир ${fmt(i.fl)}</small></span>${B('Ставка',`bidp('${i.id}')`)}</div>`).join(''),
gov:()=>H(g.ip?'ИП оформлено':'Нет ИП','Госуслуги')+(g.ip?'':B('Оформить ИП · 5 000 ₽','gov(\'ip\')'))+B('Оплатить налог 6% с прибыли','gov(\'tax\')','g')+'<div class="mu">ИП: репутация +5 и кредит до 200 000 ₽. Налог даёт репутацию.</div>',
acc:()=>H('Аксессуары','Чехол и стекло: 1 500 ₽, состояние +4%')+g.inv.map(i=>`<div class="card row"><span>${i.n}</span>${i.ac?'<span class="ok">✔</span>':B('Купить',`acc('${i.id}')`)}</div>`).join(''),
task:()=>H(g.deals+' сделок','Задания')+[1,5,10,25,50,100].map(n=>`<div class="card row"><span>Совершить ${n} сделок<br><small class="mu">награда ${fmt(n*2000)}</small></span>${g.tk.includes(n)?'<span class="ok">✔</span>':B(g.deals>=n?'Забрать':g.deals+'/'+n,`tkc(${n})`,g.deals>=n?'':'g')}</div>`).join(''),
stk:()=>H('Биржа','Цены меняются каждые 5 минут')+['TECH','GOLD','RUBX','CRYP'].map((n,k)=>`<div class="card row"><span><b>${n}</b> ${fmt(g.sp[k])}<br><small class="mu">у вас: ${g.sq[k]}</small></span><span>${B('+1',`stb(${k},1)`)}${B('−1',`stb(${k},-1)`,'g')}</span></div>`).join(''),
num:()=>H('Номера','Крутить за 300 ₽')+B('Крутить номер','rnum()')+g.nums.map((x,k)=>`<div class="card row"><span>${x.n}<br><small class="mu">цена ${fmt(x.v)}</small></span>${B('Продать',`snum(${k})`,'g')}</div>`).join(''),
est:()=>H('Недвижимость','Доход начисляется каждый день')+AS([['Студия',300000,2500],['Квартира',900000,8000],['Офис',1500000,14000]]),
biz:()=>H('Бизнес','Доход начисляется каждый день')+AS([['Киоск',120000,1400],['Сервисный центр',400000,4800],['Магазин техники',1000000,13000]]),
shf:()=>H('Смена','Раз в день')+[['Продавец',2500],['Курьер',3500],['Сборщик',4500]].map(([n,p])=>`<div class="card row"><span>${n}<br><small class="mu">+${fmt(p)}</small></span>${B('Выйти',`work(${p})`)}</div>`).join(''),
jb:()=>H('Джейлбрейк','Снятие блокировок (шанс зависит от ноутбука)')+(g.inv.filter(i=>i.d.includes('sw')&&i.seen).map(i=>`<div class="card row"><span>${i.n}</span>${B('Взломать',`jbk('${i.id}')`)}</div>`).join('')||'<div class="mu">Нужны устройства с найденной блокировкой на складе (сделайте диагностику).</div>'),
bm:()=>H('Чёрный рынок','Дёшево, но 25% что кинут')+g.bm.map(i=>`<div class="card row"><span><b>${i.n}</b><br><small class="mu">без гарантий</small></span>${B(fmt(i.ask),`bbm('${i.id}')`)}</div>`).join(''),
bld:()=>H('Сборка ПК','Продаётся дороже суммы деталей')+`<select id="c1">${opts([['Ryzen 5',18000],['Ryzen 7',32000],['Core i9',52000]])}</select><select id="c2">${opts([['RTX 4060',32000],['RTX 4070',48000],['RTX 4090',140000]])}</select><select id="c3">${opts([['16 ГБ',4000],['32 ГБ',8000],['64 ГБ',16000]])}</select>`+B('Собрать (+2 000 ₽ за работу)','bld()')};
setInterval(()=>{if(!g)return;const t=Math.ceil((g.nx-Date.now())/1000);if(t<=0){gen();tickS();save();if(!$('#md').innerHTML&&(cur=='m'||cur=='mp'))render();toast('Рынок обновлён: 15 новых устройств');return}const e=$('#cd');if(e)e.textContent=(t/60|0)+':'+String(t%60).padStart(2,'0')},1000);
// ===== Старт =====
const last=ST.g('pk2:last'),raw=last&&ST.g('pk2:'+last);if(raw){try{g=JSON.parse(raw)}catch(e){}}render();
</script></body></html>
