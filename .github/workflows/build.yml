name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Найти файл игры
        run: |
          test -f index.html || mv "$(ls *.html | head -1)" index.html
          ls -la

      - run: bash build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Perekup3-apk
          path: Perekup3.apk

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Перекуп 3, сборка ${{ github.run_number }}
          files: Perekup3.apk
